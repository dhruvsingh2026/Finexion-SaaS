<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="pSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#129FE3" />
      <stop offset="60%" stop-color="#55BEEF" />
      <stop offset="100%" stop-color="#AEE1FA" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B37854" />
      <stop offset="100%" stop-color="#8C5332" />
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E6EA" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C212B" />
      <stop offset="100%" stop-color="#080D16" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="750" fill="url(#pSky)" />
  <!-- Soft sun glow -->
  <circle cx="450" cy="180" r="180" fill="#FFFFFF" opacity="0.22" filter="url(#pGlow)" />
  <!-- Wispy cloud -->
  <path d="M40 280 Q140 230 260 260 T460 270 Q420 330 240 330 Z" fill="#FFFFFF" opacity="0.35" filter="url(#pGlow)" />

  <!-- Person Silhouette & Figure -->
  <!-- Shoulders & White Tee -->
  <path d="M120 750 C120 620 180 520 250 490 L350 490 C420 520 480 620 480 750 Z" fill="url(#shirt)" />
  <path d="M250 490 Q300 530 350 490 Z" fill="#D0D6DC" opacity="0.6" />

  <!-- Neck -->
  <rect x="272" y="400" width="56" height="100" rx="16" fill="url(#skin)" />

  <!-- Head (Looking down towards hands/phone) -->
  <ellipse cx="300" cy="340" rx="72" ry="86" fill="url(#skin)" />

  <!-- Hair (Modern textured dark crop) -->
  <path d="M228 320 C225 240 280 230 340 238 C375 244 380 280 376 330 C350 265 315 255 255 285 Z" fill="#1C1814" />
  <path d="M240 255 Q290 235 350 250 Q365 275 368 310 Q340 280 290 275 Z" fill="#2E2822" />

  <!-- Ear -->
  <ellipse cx="232" cy="345" rx="12" ry="18" fill="#99603D" />

  <!-- Sunglasses / Brow shadow looking down -->
  <path d="M255 330 Q285 345 315 335" stroke="#4A2F1F" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M270 365 Q290 380 310 368" stroke="#7A4525" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Arms / Hands holding phone -->
  <path d="M190 750 C190 660 220 590 255 560 L285 620 C250 645 220 690 215 750 Z" fill="url(#skin)" />
  <path d="M410 750 C410 660 380 590 345 560 L315 620 C350 645 380 690 385 750 Z" fill="url(#skin)" />

  <!-- Mobile Smartphone in Hand -->
  <g transform="translate(260, 520) rotate(-4)">
    <rect x="0" y="0" width="80" height="135" rx="14" fill="url(#phoneGrad)" stroke="#4A5568" stroke-width="2" />
    <rect x="5" y="8" width="70" height="119" rx="10" fill="#129FE3" />
    <!-- Screen light reflection -->
    <path d="M6 10 L74 60 L74 125 L6 75 Z" fill="#FFFFFF" opacity="0.12" />
    <!-- Screen UI preview: Lime accent pill -->
    <rect x="18" y="24" width="44" height="8" rx="4" fill="#D8FF4F" />
    <rect x="18" y="38" width="30" height="4" rx="2" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>
